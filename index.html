  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = storedTheme ? storedTheme === "dark" : prefersDark;
        const root = document.documentElement;

        root.classList.toggle("dark", useDark);
        root.dataset.theme = useDark ? "dark" : "light";
        root.style.colorScheme = useDark ? "dark" : "light";
        root.style.backgroundColor = useDark ? "#192226" : "#AEB8B7";
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          useDark ? "#192226" : "#AEB8B7",
        );
      } catch {
        document.documentElement.style.backgroundColor = "#AEB8B7";
      }
    })();
  </script>
  <style>
    html { background: #AEB8B7; }
    html.dark,
    html[data-theme="dark"] { background: #192226; }
