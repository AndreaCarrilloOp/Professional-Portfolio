name: Portfolio quality

on:
  push:
    branches:
      - main
      - accessibility/wcag-navigation-improvements
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check palette, contrast, lint, static tests, and build
        run: pnpm check
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test responsive layout and interactions
        run: python scripts/test-browser.py
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
